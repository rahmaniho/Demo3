<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کارن استودیو — استودیوی پرترهٔ کارن کیانی، تهران</title>
    <meta
      name="description"
      content="کارن استودیو، کارگاه پرترهٔ کارن کیانی در تهران است؛ عکاسی تحریریه، برند و جلسه‌های خصوصی — روی فیلم، چاپ با دست. پرتره‌هایی در تاریکی."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ctext x='32' y='45' font-family='Vazirmatn, Tahoma, sans-serif' font-size='34' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3Eک%3C/text%3E%3C/svg%3E"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="کارن استودیو — پرتره‌هایی در تاریکی" />
    <meta
      property="og:description"
      content="استودیوی پرترهٔ کارن کیانی در تهران؛ عکاسی تحریریه، برند و جلسه‌های خصوصی — روی فیلم، چاپ با دست."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Markazi+Text:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("karen-theme");
          var dark = saved ? saved === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Tahoma, sans-serif; direction: rtl; padding: 2rem; text-align: center">
        برای دیدن این سایت، لطفاً جاوااسکریپت مرورگر خود را فعال کنید.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
